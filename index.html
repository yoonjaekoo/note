<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note — 수학 필기</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="toolbar" role="toolbar" aria-label="필기 도구">
      <div class="group" role="group" aria-label="도구">
        <button class="tool" data-tool="lasso" aria-label="올가미 선택" title="올가미 선택 (Q) — 드래그로 묶어 이동">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 8.5c0-3 2.8-5 6-5s5.5 2 5 5-2.2 4.2-4 5.2c-1.2.7-1.2 2.2.2 2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="12.2" cy="16.8" r="0.9" fill="currentColor"/></svg>
        </button>
        <button class="tool" data-tool="select" aria-label="선택/편집" title="선택/편집 (V) — 꼭짓점 드래그">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5 15 9.5 10.2 10.8 8.2 15.8 5 3.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool active" data-tool="pen" aria-label="펜" title="펜 (P)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14.5 12.8 4.7a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4L5.5 17H3v-2.5Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool" data-tool="eraser" aria-label="지우개" title="지우개 (E)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 13.5 10.5 7l4 4-4.5 4.5H6L4 13.5Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 15.5h10" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool" data-tool="line" aria-label="직선" title="직선 (L)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 16 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="tool" data-tool="rect" aria-label="사각형" title="사각형 (R)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="5" width="12" height="10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool" data-tool="ellipse" aria-label="원/타원" title="원/타원 (O, Shift=원)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="10" rx="6.5" ry="5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool" data-tool="polygon" aria-label="다각형" title="다각형 (Y, 더블클릭/시작점 클릭으로 완성)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4 16 8.5 14 15.5H6L4 8.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" data-tool="regpoly" aria-label="정다각형" title="정다각형 (N, 변 개수 입력)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5 15.5 6.8v6.4L10 16.5 4.5 13.2V6.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <label class="field poly-sides-field" title="정다각형 변 개수">
          <span class="sr">변 개수</span>
          <input id="poly-sides" type="number" min="3" max="60" value="6" aria-label="정다각형 변 개수">
        </label>
        <button class="tool" data-tool="text" aria-label="텍스트" title="텍스트 (T)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5h10M10 5v10M7.5 15h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg>
        </button>
        <button class="tool" data-tool="pan" aria-label="이동" title="이동 (Space 드래그 / H)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v6m0 0 2.5-2.5M10 9 7.5 6.5M10 9v3.5m0 0-3 0a1.5 1.5 0 0 1-1.4-2l1.4-3.5V9m3 3.5 3 0a1.5 1.5 0 0 0 1.4-2l-1.4-3.5V9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="sep" aria-hidden="true"></div>
      <div class="group" role="group" aria-label="잉크">
        <label class="field" title="굵기">
          <span class="sr">굵기</span>
          <input id="size" type="range" min="1" max="18" value="2">
        </label>
        <button class="swatch active" data-ink="#1f2328" aria-label="검정 잉크" title="검정"></button>
        <button class="swatch" data-ink="#6a7078" aria-label="회색 잉크" title="회색"></button>
        <button class="swatch accent" data-ink="#2f5ea8" aria-label="강조 잉크" title="강조"></button>
      </div>
      <div class="sep" aria-hidden="true"></div>
      <div class="group" role="group" aria-label="수학">
        <button class="tool" id="math-toggle" aria-label="수학 도구" aria-expanded="false" title="수학 도구 (M)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12l-4 5 4 5H4l4-5-4-5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="curve-toggle" aria-label="곡선 인식" aria-pressed="false" title="곡선 인식(그래프) (C)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14c2-6 5-8 7-4s5 2 7-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="tool" id="grid-toggle" aria-label="격자" aria-pressed="false" title="격자 (G)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12v12H4zM8 4v12M12 4v12M4 8h12M4 12h12" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
      <div class="sep" aria-hidden="true"></div>
      <div class="group" role="group" aria-label="보기">
        <button class="tool" id="zoom-out" aria-label="축소" title="축소 (Ctrl+-)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13 13l3.5 3.5M7 9h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="tool zoom-readout" id="zoom-reset" aria-label="확대/축소 초기화" title="100%로 초기화 (Ctrl+0)">100%</button>
        <button class="tool" id="zoom-in" aria-label="확대" title="확대 (Ctrl+=)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13 13l3.5 3.5M7 9h4M9 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sep" aria-hidden="true"></div>
      <div class="group" role="group" aria-label="편집">
        <button class="tool" id="undo" aria-label="실행 취소" title="실행 취소 (Ctrl+Z)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6 4 9l3 3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 9H12a4 4 0 1 1 0 8h-1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool" id="redo" aria-label="다시 실행" title="다시 실행 (Ctrl+Y)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m13 6 3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M15.5 9H8a4 4 0 1 0 0 8h1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool" id="clear" aria-label="페이지 지우기" title="페이지 지우기">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 6h10M8 6V4.5h4V6m-5 0 .5 9h5l.5-9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div class="spacer"></div>
      <div class="group" role="group" aria-label="파일">
        <button class="tool" id="save" aria-label="저장" title="저장 (Ctrl+S)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h8l2 2v9H5V4Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 4v4h6V4M7 15v-4h6v4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="tool" id="open" aria-label="열기" title="열기">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h4l2 2h6v7H4V6Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <input id="file-input" type="file" accept=".notemath.json,application/json" hidden>
      </div>
    </header>

    <div class="math-panel" id="math-panel" hidden>
      <div class="math-row" id="math-templates" aria-label="수학 템플릿"></div>
      <div class="math-row" id="math-symbols" aria-label="수학 기호"></div>
      <div class="math-row math-entry">
        <label class="sr" for="math-input">수식 텍스트</label>
        <input id="math-input" type="text" placeholder="수식/텍스트 입력 후 배치" spellcheck="false">
        <button class="action" id="math-place" type="button">배치</button>
      </div>
      <div class="math-row math-entry">
        <label class="sr" for="calc-input">계산</label>
        <input id="calc-input" type="text" placeholder="계산식 (예: 2*(3+4)/5, sqrt(9), sin(0.5), pi^2)" spellcheck="false">
        <button class="action" id="calc-run" type="button">계산</button>
        <button class="action" id="calc-place" type="button">결과 배치</button>
        <span id="calc-result" class="calc-result" aria-live="polite"></span>
      </div>
    </div>

    <main class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div id="overlay" class="overlay" aria-live="polite"></div>
    </main>

    <footer class="status">
      <span id="status-tool">펜</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <span id="status-pos">준비</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <span id="status-zoom">100%</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <span>Note (Windows)</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
